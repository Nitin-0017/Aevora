[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aevora"
version = "0.1.0"
description = "AEVORA — Predictive Maintenance Intelligence"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3", "pandas>=2.2,<3", "scikit-learn>=1.6,<2",
  "matplotlib>=3.8,<4", "plotly>=5.24,<7", "torch>=2.6,<3",
  "streamlit>=1.54,<2", "altair>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
